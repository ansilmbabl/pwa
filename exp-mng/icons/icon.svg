<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111114"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="156" y1="140" x2="356" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="72" y="72" width="368" height="368" rx="88" stroke="#27272a" stroke-width="4"/>
  <!-- Ledger spine -->
  <rect x="128" y="148" width="256" height="216" rx="28" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
  <rect x="148" y="168" width="12" height="176" rx="6" fill="#27272a"/>
  <!-- Chart bars -->
  <rect x="188" y="284" width="36" height="56" rx="8" fill="url(#accent)" opacity="0.45"/>
  <rect x="238" y="248" width="36" height="92" rx="8" fill="url(#accent)" opacity="0.7"/>
  <rect x="288" y="212" width="36" height="128" rx="8" fill="url(#accent)" filter="url(#glow)"/>
  <!-- Rupee mark -->
  <text x="256" y="210" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="700" fill="url(#accent)">&#x20B9;</text>
  <!-- Trend line -->
  <path d="M176 320 L228 292 L278 304 L336 248" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="336" cy="248" r="10" fill="#2dd4bf"/>
</svg>
